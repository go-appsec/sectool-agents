name: claude-controller Tests

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: claude-controller

jobs:
  test:
    name: Verify Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
        - '3.12'
        - '3.11'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: claude-controller/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest
